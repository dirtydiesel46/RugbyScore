<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>RugbyScore</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="container" aria-label="Rugby scoreboard">
            <section class="team">
                <h2 id="home-heading">HOME</h2>
                <div class="score" id="home-score" aria-live="polite" aria-atomic="true" aria-labelledby="home-heading">0</div>
                <div class="increment">
                    <button onclick="add(2, 'home-score')" id="home-add-conversion"><span class="point-label">Conversion</span><span>+2</span></button>
                    <button onclick="add(3, 'home-score')" id="home-add-penalty"><span class="point-label">Penalty goal</span><span>+3</span></button>
                    <button onclick="add(5, 'home-score')" id="home-add-try"><span class="point-label">Try</span><span>+5</span></button>
                    <button onclick="add(3, 'home-score')" id="home-add-drop"><span class="point-label">Drop goal</span><span>+3</span></button>
                    <button onclick="add(7, 'home-score')" id="home-add-penalty-try"><span class="point-label">Penalty try</span><span>+7</span></button>
                </div>
            </section>
            <section class="team">
                <h2 id="guest-heading">GUEST</h2>
                <div class="score" id="guest-score" aria-live="polite" aria-atomic="true" aria-labelledby="guest-heading">0</div>
                <div class="increment">
                    <button onclick="add(2, 'guest-score')" id="guest-add-conversion"><span class="point-label">Conversion</span><span>+2</span></button>
                    <button onclick="add(3, 'guest-score')" id="guest-add-penalty"><span class="point-label">Penalty goal</span><span>+3</span></button>
                    <button onclick="add(5, 'guest-score')" id="guest-add-try"><span class="point-label">Try</span><span>+5</span></button>
                    <button onclick="add(3, 'guest-score')" id="guest-add-drop"><span class="point-label">Drop goal</span><span>+3</span></button>
                    <button onclick="add(7, 'guest-score')" id="guest-add-penalty-try"><span class="point-label">Penalty try</span><span>+7</span></button>
                </div>
            </section>
            <div class="game-controls">
                <button id="undo-button" onclick="undoLastScore()" disabled>Undo last score</button>
                <button onclick="newGame()">New game</button>
            </div>
            <p id="game-status" class="game-status" role="status"></p>
        </main>
        <script src="index.js"></script>
    </body>
</html>
