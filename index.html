<html>
    <head>
        <title>RugbyScore</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class=score id="home-score"></div>
                <div class="increment">
                    <button onclick="add(2, 'home-score')" id="home-add-conversion"><span class="point-label">Conversion</span><span>+2</span></button>
                    <button onclick="add(3, 'home-score')" id="home-add-penalty"><span class="point-label">Penalty goal</span><span>+3</span></button>
                    <button onclick="add(5, 'home-score')" id="home-add-try"><span class="point-label">Try</span><span>+5</span></button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div  class=score id="guest-score"></div>
                <div class="increment">
                    <button onclick="add(2, 'guest-score')" id="guest-add-conversion"><span class="point-label">Conversion</span><span>+2</span></button>
                    <button onclick="add(3, 'guest-score')" id="guest-add-penalty"><span class="point-label">Penalty goal</span><span>+3</span></button>
                    <button onclick="add(5, 'guest-score')" id="guest-add-try"><span class="point-label">Try</span><span>+5</span></button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
