<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class=score id="home-score"></div>
                <div class="increment">
                    <button onclick="add(1, 'home-score')" id="home-add-1">+1</button>
                    <button onclick="add(2, 'home-score')" id="home-add-2">+2</button>
                    <button onclick="add(3, 'home-score')" id="home-add-3">+3</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div  class=score id="guest-score"></div>
                <div class="increment">
                    <button onclick="add(1, 'guest-score')" id="guest-add-1">+1</button>
                    <button onclick="add(2, 'guest-score')" id="guest-add-2">+2</button>
                    <button onclick="add(3, 'guest-score')" id="guest-add-3">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
